apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    # Notice the OCI URL syntax for Argo
    repoURL: docker.io/envoyproxy
    chart: gateway-crds-helm
    targetRevision: v1.8.2
    helm:
      values: |
        crds:
          gatewayAPI:
            enabled: true
            channel: standard
          envoyGateway:
            enabled: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: envoy-gateway-system
  syncPolicy:
    createNamespace: true
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # Matches the --server-side requirement for huge CRDs
