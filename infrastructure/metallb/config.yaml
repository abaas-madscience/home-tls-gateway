---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: gateway-ip-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.68.250/32  # Explicitly binds only this IP
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: gateway-l2-adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - gateway-ip-pool
