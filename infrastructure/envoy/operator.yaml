---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway-chart
  namespace: flux-system
spec:
  interval: 5m
  url: oci://docker.io/envoyproxy/gateway-helm
  ref:
    tag: v1.8.2
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  releaseName: eg
  interval: 5m
  chart:
    spec:
      chart: gateway-helm
      version: "v1.8.2"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway-charts
        namespace: flux-system
  targetNamespace: envoy-gateway
  install:
    createNamespace: true
  values:
    # Since we ran the server-side apply for the CRDs, skip rendering them here
    crds:
      enabled: true
