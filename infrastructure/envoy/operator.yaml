---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: envoy-gateway-charts
  namespace: flux-system
spec:
  type: oci
  interval: 5m
  url: oci://docker.io/envoyproxy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  releaseName: eg
  interval: 5m
  chart:
    spec:
      chart: gateway-helm
      version: "v1.8.2"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway-charts
        namespace: flux-system
  targetNamespace: envoy-gateway
  createTargetNamespace: true
  values:
    # Since we ran the server-side apply for the CRDs, skip rendering them here
    crds:
      enabled: true
