---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      # Pod-level security settings
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.30-latest
        ports:
        - name: http
          containerPort: 10000
        - name: admin
          containerPort: 9901
        # Container-level security settings
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false # Envoy may need write access to /tmp or logs unless configured otherwise
