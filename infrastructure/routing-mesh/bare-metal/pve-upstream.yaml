---
apiVersion: v1
kind: Service
metadata:
  name: upstream-pve-backend-svc
  namespace: routing-mesh
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: upstream-pve-backend-slice
  namespace: routing-mesh
  labels:
    kubernetes.io/service-name: upstream-pve-backend-svc
addressType: IPv4
ports:
  - name: http
    port: 8006
contains:
  - addresses:
      - 192.168.68.2
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pve-upstream-route
  namespace: routing-mesh
spec:
  parentRefs:
    - name: edge-gateway
      namespace: routing-mesh
  hostnames:
    - "upstream.datakube.org"
  rules:
    - backendRefs:
        - name: upstream-pve-backend-svc
          port: 80
