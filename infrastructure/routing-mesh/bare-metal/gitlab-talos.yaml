---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-backend-svc
  namespace: routing-mesh
spec:
  ports:
    - name: https      # Renamed to explicitly signal the intent
      port: 443        # The logical routing port for the service
      targetPort: 443  # Map logical service port 443 to the physical 8006 backend
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitlab-backend-slice
  namespace: routing-mesh
  labels:
    kubernetes.io/service-name: gitlab-backend-svc
addressType: IPv4
ports:
  - name: https
    port: 443
endpoints:
  - addresses:
      - "192.168.68.30"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab-route
  namespace: routing-mesh
spec:
  parentRefs:
    - name: edge-gateway
      namespace: routing-mesh
  hostnames:
    - "gl.datakube.org"
  rules:
    - backendRefs:
        - name: gitlab-backend-svc
          port: 443
