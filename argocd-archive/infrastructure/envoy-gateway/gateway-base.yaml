---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg  # Short name for Envoy Gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge-gateway
  namespace: routing-mesh
  annotations:
    # Forces MetalLB to assign your specific pool IP
    # to this Gateway's proxy service
    metallb.universe.tf/loadBalancerIPs: "192.168.68.250"
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: datakube-org-tls  # Matches cert-manager output secret
      allowedRoutes:
        namespaces:
          from: All
