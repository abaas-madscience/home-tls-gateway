---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://github.com/abaas-madscience/home-tls-gateway.git'
    targetRevision: HEAD
    path: infrastructure/envoy-gateway
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
